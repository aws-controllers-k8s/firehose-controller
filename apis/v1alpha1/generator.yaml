        }

      ExtendedS3DestinationConfiguration.S3BackupConfiguration:
        set:
          - method: Update
            to: S3BackupUpdate

      ExtendedS3DestinationConfiguration.S3BackupConfiguration.BucketARN:
        references:
          resource: Bucket
          service_name: s3
          path: Status.ACKResourceMetadata.ARN

      ExtendedS3DestinationConfiguration.S3BackupConfiguration.RoleARN:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN

      ExtendedS3DestinationConfiguration.S3BackupConfiguration.BufferingHints:
        late_initialize: {
